name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TodayChecklist.sln

      - name: Build
        run: dotnet build TodayChecklist.sln -c Release --no-restore

      - name: Publish
        run: dotnet publish TodayChecklist.csproj -c Release -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: TodayChecklist-win
          path: publish
          if-no-files-found: error
          retention-days: 14
